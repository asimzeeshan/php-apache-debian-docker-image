name: Build and Push PHP-Apache Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 19 * * *' # Runs daily at 7 PM UTC / Midnight Pakistan time
  workflow_dispatch:      # Allows manual triggering from GitHub UI

permissions:
  contents: read
  actions: write   # needed by the keepalive step to re-enable this workflow

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate tag
        id: vars
        run: echo "TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Build the Docker image
      #   run: docker build . --file Dockerfile --tag asimzeeshan/php:latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags:  |
            asimzeeshan/php:latest
            asimzeeshan/php:${{ steps.vars.outputs.TAG }}

      # GitHub disables scheduled workflows after 60 days without commits.
      # Re-enabling via the API on every run resets that timer, so the daily
      # build keeps going without needing dummy commits.
      - name: Keep scheduled workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # The REST endpoint is idempotent; `gh workflow enable <name>` only
        # matches disabled workflows and fails once the workflow is active.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-build.yml/enable"
